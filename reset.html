<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — Paris Comedy</title>
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--purple:#7c3aed;--purple-light:#9d5ff5;--bg:#0a0a0a;--card:#111;--border:#1e1e1e;--text:#f0f0f0;--muted:#888;--yellow:#f5c518;--green:#10b981;--red:#ef4444}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
a{color:var(--purple-light);text-decoration:none}
nav{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:20}
.nav-logo{font-size:18px;font-weight:700}.nav-logo span{color:var(--yellow)}
main{max-width:460px;margin:48px auto;padding:24px}
h1{font-size:28px;margin-bottom:8px}.sub{color:var(--muted);line-height:1.5;margin-bottom:20px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
input{width:100%;padding:11px 12px;background:#0f0f0f;border:1px solid var(--border);border-radius:8px;color:var(--text);font:inherit;margin-bottom:14px}
input:focus{outline:none;border-color:var(--purple)}
.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:800;cursor:pointer;background:var(--purple);color:#fff;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.msg{margin-top:12px;color:var(--muted);line-height:1.45}.err{color:#fca5a5}.ok{color:#86efac}
</style>
</head>
<body>
<nav><a href="/" class="nav-logo">Paris<span>Comedy</span></a><a href="/login.html">Sign In</a></nav>
<main>
  <h1>Set a new password</h1>
  <p class="sub">Choose a new password for your Paris Comedy account. This link is single-use and expires 30 minutes after it was requested.</p>
  <div class="panel">
    <form onsubmit="return submitReset(event)">
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required>
      <label for="pw2">Confirm password</label>
      <input id="pw2" type="password" autocomplete="new-password" placeholder="Repeat password" minlength="8" required>
      <button class="btn" id="btn" type="submit">Set password & sign in</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>
</main>
<script>
let API='';
async function apiBase(){if(API)return API;try{const c=await fetch('/api-config.json',{cache:'no-store'}).then(r=>r.json());API=c.api||'';}catch(e){API='';}return API;}
const token=new URLSearchParams(location.search).get('token')||'';
if(!token){document.getElementById('msg').className='msg err';document.getElementById('msg').textContent='This reset link is missing its token. Request a new one from the sign-in page.';document.getElementById('btn').disabled=true;}
async function submitReset(ev){
  ev.preventDefault();
  const pw=document.getElementById('pw').value, pw2=document.getElementById('pw2').value;
  const msg=document.getElementById('msg');
  if(pw.length<8){msg.className='msg err';msg.textContent='Password must be at least 8 characters.';return false;}
  if(pw!==pw2){msg.className='msg err';msg.textContent='Passwords do not match.';return false;}
  msg.className='msg';msg.textContent='Setting your password…';
  try{
    const base=await apiBase();
    const r=await fetch(base+'/api/auth/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:pw})});
    const j=await r.json().catch(()=>({detail:r.statusText}));
    if(!r.ok)throw new Error(j.detail||('HTTP '+r.status));
    if(j.session_token){localStorage.setItem('pc_session_token',j.session_token);localStorage.setItem('pc_auth_email',j.email||'');}
    msg.classList.add('ok');msg.textContent='Password set. Signing you in…';
    setTimeout(function(){location.href='/performer-portal.html';},700);
  }catch(e){msg.className='msg err';msg.textContent=e.message||'Could not reset password.';}
  return false;
}
</script>
</body>
</html>
