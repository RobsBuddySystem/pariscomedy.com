let lang = localStorage.getItem('lang') || 'en';
function setLang(l){
  lang=l; localStorage.setItem('lang',l);
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));
  document.querySelectorAll('[data-en]').forEach(el=>{
    el.textContent = l==='fr' ? (el.dataset.fr||el.dataset.en) : el.dataset.en;
  });
  document.querySelectorAll('[data-en-html]').forEach(el=>{
    el.innerHTML = l==='fr' ? (el.dataset.frHtml||el.dataset.enHtml) : el.dataset.enHtml;
  });
}
document.addEventListener('DOMContentLoaded',()=>setLang(lang));

let activeFilter='all';

function renderGrid(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  SHOWS.forEach(s=>{
    if(activeFilter!=='all'&&s.lang!==activeFilter&&!(activeFilter==='en'&&s.lang==='bilingual')&&!(activeFilter==='fr'&&s.lang==='bilingual')) return;
    const days=s.days.join(' / ');
    const tag=s.lang==='fr'?'<span class="tag tag-fr">FR</span>':s.lang==='bilingual'?'<span class="tag tag-bi">Bilingue</span>':'<span class="tag tag-en">EN</span>';
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`
      <div class="card-emoji">${s.emoji}</div>
      <div class="card-name">${s.name}</div>
      ${s.venue?`<div class="card-venue">${s.venue}</div>`:''}
      <div class="card-days">${days} ${s.time}</div>
      ${tag}
      <div class="card-desc" data-en="${s.desc_en.replace(/"/g,'&quot;')}" data-fr="${(s.desc_fr||s.desc_en).replace(/"/g,'&quot;')}">${lang==='fr'?(s.desc_fr||s.desc_en):s.desc_en}</div>
      ${s.url?`<a href="${s.url}" target="_blank" class="btn-book" data-en="Book / Info" data-fr="Réserver / Info">Book / Info</a>`:''}
    `;
    grid.appendChild(card);
  });
  setLang(lang);
}
renderGrid();

document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter=btn.dataset.lang;
    renderGrid();
  });
});

async function payInvoice(){
  const name=document.getElementById('m-name').value.trim();
  const email=document.getElementById('m-email').value.trim();
  const bio=document.getElementById('m-bio').value.trim();
  const lid=document.getElementById('m-show').value;
  const err=document.getElementById('m-err');
  err.textContent='';
  if(!name||!email||!bio){err.textContent='Please fill in all fields.';return;}
  const btn=document.getElementById('btn-pay');
  btn.disabled=true;btn.textContent='Getting invoice…';
  try{
    const cfg=await fetch('/api-config.json').then(r=>r.json()).catch(()=>({api:''}));
    const API=cfg.api||'';
    if(!API){err.textContent='Payment API offline.';btn.disabled=false;btn.textContent='Get invoice ⚡ €1';return;}
    const r=await fetch(`${API}/api/listings/${lid}/bio-invoice`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,bio_text:bio})});
    const d=await r.json();
    if(!r.ok){err.textContent=d.detail||'Error.';btn.disabled=false;btn.textContent='Get invoice ⚡ €1';return;}
    const b=d.bolt11||d.payment_request;
    if(!b){err.textContent='No invoice returned.';btn.disabled=false;btn.textContent='Get invoice ⚡ €1';return;}
    document.getElementById('modal-form').style.display='none';
    document.getElementById('modal-qr').style.display='';
    const img=new Image();img.crossOrigin='anonymous';
    img.onload=()=>{const c=document.getElementById('qr-canvas');c.getContext('2d').drawImage(img,0,0,220,220);};
    img.src=`https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent('lightning:'+b)}`;
  }catch(e){err.textContent='Error: '+e.message;btn.disabled=false;btn.textContent='Get invoice ⚡ €1';}
}
document.getElementById('modal-bg').addEventListener('click',e=>{if(e.target.id==='modal-bg')e.target.classList.remove('open');});
document.getElementById('modal-bg').style.removeProperty('display');
document.getElementById('modal-bg').style.display='none';
document.querySelectorAll('.nav-submit').forEach(b=>b.onclick=()=>{
  document.getElementById('modal-form').style.display='';
  document.getElementById('modal-qr').style.display='none';
  document.getElementById('m-err').textContent='';
  document.getElementById('btn-pay').disabled=false;
  document.getElementById('btn-pay').textContent='Get invoice ⚡ €1';
  document.getElementById('modal-bg').style.display='flex';
});

</script>
