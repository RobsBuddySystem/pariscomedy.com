<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Shows — Paris Comedy</title>
<meta name="description" content="Every English-language stand-up comedy show in Paris. Browse by night, find your show, book tickets.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#f0f0f0;min-height:100vh}
a{color:inherit;text-decoration:none}
nav{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid #222;position:sticky;top:0;background:#0a0a0a;z-index:100;flex-wrap:wrap;gap:8px}
.nav-logo{font-size:18px;font-weight:700;letter-spacing:-0.5px}
.nav-logo span{color:#f5c518}
.nav-links{display:flex;gap:20px;font-size:14px;color:#888;flex-wrap:wrap}
.nav-links a:hover{color:#f0f0f0}
.nav-active{color:#f0f0f0!important}
.hero{text-align:center;padding:52px 24px 36px}
.hero h1{font-size:clamp(26px,4vw,48px);font-weight:800;letter-spacing:-1px;line-height:1.15;margin-bottom:12px}
.hero h1 span{color:#f5c518}
.hero p{color:#888;font-size:15px;max-width:500px;margin:0 auto}
.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:20px 16px 0}
.filter-btn{padding:8px 18px;border-radius:20px;border:1px solid #333;background:transparent;color:#888;font-size:13px;cursor:pointer}
.filter-btn:hover{border-color:#666;color:#f0f0f0}
.filter-btn.active{background:#f5c518;border-color:#f5c518;color:#000;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:24px;max-width:1100px;margin:0 auto}
.card{background:#111;border:1px solid #1e1e1e;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px}
.card:hover{border-color:#333}
.card-emoji{font-size:28px}
.card-name{font-size:15px;font-weight:700}
.card-venue{font-size:12px;color:#666}
.card-days{font-size:12px;color:#888}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.tag-en{background:#1a3a5c;color:#7ab3e0}
.card-desc{font-size:13px;color:#888;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn-book{margin-top:auto;padding:9px;border-radius:8px;border:none;background:#f5c518;color:#000;font-size:12px;font-weight:700;cursor:pointer;text-align:center;display:block}
.btn-book:hover{opacity:.9}
footer{border-top:1px solid #222;padding:32px 24px;text-align:center;color:#666;font-size:13px}
footer a{color:#666}footer a:hover{color:#f0f0f0}
.footer-links{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">Paris<span>Comedy</span></a>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/shows.html" class="nav-active">Shows</a>
    <a href="/hiring.html">Stage Time</a>
    <a href="/venues.html">Venues</a>
    <a href="/comedians.html">Comedians</a>
    <a href="/bookers.html">Bookers</a>
    <a href="/pricing.html">Pricing</a>
    <a href="/login.html">Sign In</a>
    <a href="/connect.html">Book / Connect</a>
    <a href="/about.html">About</a>
    <a href="/feedback.html">Feedback</a>
  </div>
</nav>

<div class="hero">
  <h1>Paris Comedy <span>Shows</span></h1>
  <p>Stand-up every night of the week — English and French stand-up across Paris.</p>
</div>

<div class="filters">
  <button class="filter-btn active" data-day="all">All</button>
  <button class="filter-btn" data-day="Monday">Mon</button>
  <button class="filter-btn" data-day="Tuesday">Tue</button>
  <button class="filter-btn" data-day="Wednesday">Wed</button>
  <button class="filter-btn" data-day="Thursday">Thu</button>
  <button class="filter-btn" data-day="Friday">Fri</button>
  <button class="filter-btn" data-day="Saturday">Sat</button>
  <button class="filter-btn" data-day="Sunday">Sun</button>
</div>

<div class="grid" id="grid"></div>

<footer>
  <div class="footer-links">
    <a href="/">Home</a>
    <a href="/shows.html">Shows</a>
    <a href="/venues.html">Venues</a>
    <a href="/comedians.html">Comedians</a>
    <a href="/connect.html">Book / Connect</a>
    <a href="/about.html">About</a>
  </div>
  <div>payments@pariscomedy.com</div>
</footer>

<script>
// Shows are read LIVE from /api/listings — never bake a static array here.
// site_guard R10 enforces this; the baked array caused repeated stale / blank-grid incidents.
let SHOWS = [];
async function loadShows() {
  let api = 'https://api.pariscomedy.com';
  try { const c = await fetch('/api-config.json', {cache:'no-store'}).then(r=>r.json()); if (c && c.api) api = c.api; } catch (e) {}
  try {
    const rows = await fetch(api + '/api/listings', {cache:'no-store'}).then(r=>r.json());
    SHOWS = (Array.isArray(rows) ? rows : []).map(s => ({
      id: s.id,
      slug: s.slug || '',
      name: s.name || '',
      venue: s.venue_name || (s.venue && s.venue.name) || s.venue_name_raw || '',
      days: Array.isArray(s.days) ? s.days : [],
      time: s.start_time || s.time || '',
      emoji: s.emoji || '\u{1F3A4}',
      desc: s.description_en || s.description_fr || '',
      url: s.booking_url || s.show_url || '',
      language: (s.language || 'en')
    }));
  } catch (e) { console.warn('[pc] /api/listings fetch failed', e); SHOWS = []; }
  render();
}

let active = 'all';
function isSeasonallyVisible(s) {
  const today = new Date().toLocaleDateString('sv-SE', {timeZone: 'Europe/Paris'});
  const name = (s.name || '').toLowerCase();
  if (name.includes('velvet bar comedy')) {
    if (today >= '2026-07-09' && today < '2026-09-09') return false;
    if (today > '2026-12-24') return false;
  }
  return true;
}
function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  SHOWS.forEach(s => {
    if (!s.url || !isSeasonallyVisible(s)) return;
    if (active !== 'all' && !s.days.includes(active)) return;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-emoji">${s.emoji}</div>
      <div class="card-name">${s.name}</div>
      <div class="card-venue">${s.venue}</div>
      <div class="card-days">${s.days.join(' / ')} &middot; ${s.time}</div>
      <span class="tag tag-en">${(s.language||'en').toUpperCase()}</span>
      <div class="card-desc">${s.desc}</div>
      <a href="${s.slug ? ('/show.html?slug=' + encodeURIComponent(s.slug)) : s.url}" class="btn-book">Details &amp; tickets →</a>`;
    grid.appendChild(card);
  });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    active = btn.dataset.day;
    render();
  });
});
loadShows();
</script>
</body>
</html>
