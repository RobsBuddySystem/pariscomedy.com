// Filter: exclude archived, require start_date, exclude expired end_date.
const SHOWS = ALL_SHOWS_RAW.filter(function(s) {
  if (!s.name || !s.name.trim()) return false;
  if (s.is_archived) return false;
  if (!s.start_date) return false;
  var endField = s.end_date || s.expires;
  if (endField && new Date(endField) < now) return false;
  return true;
});

const _WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const _MO = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function formatShowDate(s) {
  if (s.start_date) {
    var d = new Date(s.start_date);
    var hhmm = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    return _WD[d.getDay()] + ', ' + _MO[d.getMonth()] + ' ' + d.getDate() + ' at ' + hhmm;
  }
  return 'Upcoming — see booking page';
}

function formatLastChecked(d) {
  if (!d) return '';
  var dt = new Date(d);
  return 'Last checked: ' + dt.toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
}

function trackUrl(url) {
  return '/r.html?url=' + encodeURIComponent(url);
}

var active = 'all';
function render() {
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  var shown = 0;
  SHOWS.forEach(function(s) {
    if (active !== 'all') {
      var d = new Date(s.start_date);
      if (_WD[d.getDay()] !== active) return;
    }
    var card = document.createElement('div');
    card.className = 'card';
    var bookUrl = s.booking_url || s.url || '#';
    var sourceUrl = s.source_url || bookUrl;
    var venueLine = s.venue_name + (s.neighborhood ? ' · ' + s.neighborhood : '');
    var dateLabel = formatShowDate(s);
    var tracked = trackUrl(bookUrl);
    var lc = formatLastChecked(s.last_checked || s.last_seen);
    var reportLink = '<a href="mailto:hello@pariscomedy.com?subject=Outdated+listing&body=Show:+' + encodeURIComponent(s.name) + '" class="report-link" style="font-size:0.75rem;color:#aaa;display:block;margin-top:0.5rem;">&#9873; Report outdated listing</a>';
    card.innerHTML =
      '<div class="card-name"><a href="' + tracked + '" target="_blank" rel="noopener" style="color:inherit;">' + s.name + '</a></div>' +
      '<div class="card-venue">' + venueLine + '</div>' +
      '<div class="card-days">' + dateLabel + '</div>' +
      '<span class="tag tag-en">EN</span>' +
      (lc ? '<div style="font-size:0.75rem;color:#aaa;margin-top:4px;">' + lc + '</div>' : '') +
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:auto;">' +
        '<a href="' + tracked + '" target="_blank" rel="noopener" class="btn-book">Book / Info →</a>' +
        '<a href="' + sourceUrl + '" target="_blank" rel="noopener" style="font-size:12px;color:#888;">Source ↗</a>' +
      '</div>' +
      reportLink;
    grid.appendChild(card);
    shown++;
  });
  if (shown < 5) {
    var fb = document.createElement('div');
    fb.style.cssText = 'grid-column:1/-1;padding:24px;color:#888;';
    if (shown === 0) {
      fb.innerHTML = '<div class="no-shows-fallback"><p>No upcoming shows found for this day. <a href="/shows.html" style="color:#f5c518;">Reset filters →</a></p></div>';
    } else {
      fb.innerHTML = '<div class="no-shows-fallback"><p>We\'re refreshing the Paris comedy calendar — check back soon or <a href="mailto:hello@pariscomedy.com" style="color:#9d5ff5;">submit a show</a>.</p></div>';
    }
    grid.appendChild(fb);
  }
}

document.querySelectorAll('.filter-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    active = btn.dataset.day;
    render();
  });
});
render();
</script>
