<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Shows — Paris Comedy</title>
<meta name="description" content="Every English & French stand-up comedy show in Paris, on one calendar. Find tonight's show, browse the month, book tickets.">
<style>
:root{
  --bg:#08080f; --bg2:#0d0d18; --panel:#11111f;
  --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.14);
  --text:#f3f3f8; --muted:#8b8ba6; --dim:#5b5b74;
  --p1:#a855f7; --p2:#ec4899; --cyan:#22d3ee; --gold:#f5c518;
  --grad:linear-gradient(135deg,#a855f7 0%,#ec4899 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  background-image:radial-gradient(1200px 600px at 80% -10%,rgba(168,85,247,.12),transparent 60%),radial-gradient(900px 500px at 0% 0%,rgba(236,72,153,.10),transparent 55%)}
a{color:inherit;text-decoration:none}
nav{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px;
  background:rgba(8,8,15,.72);backdrop-filter:saturate(160%) blur(14px)}
.nav-logo{font-size:19px;font-weight:800;letter-spacing:-.6px}
.nav-logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-links{display:flex;gap:20px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.nav-links a{transition:color .15s}.nav-links a:hover{color:var(--text)}
.nav-active{color:var(--text)!important;position:relative}
.nav-active::after{content:'';position:absolute;left:0;right:0;bottom:-18px;height:2px;background:var(--grad);border-radius:2px}
.hero{text-align:center;padding:52px 24px 6px}
.hero h1{font-size:clamp(30px,5vw,54px);font-weight:900;letter-spacing:-1.5px;line-height:1.05;margin-bottom:12px}
.hero h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:15px;max-width:520px;margin:0 auto}
.calwrap{max-width:1240px;margin:0 auto;padding:26px 16px 70px}
.calbar{display:flex;align-items:center;justify-content:center;gap:14px;margin:22px 0 20px;flex-wrap:wrap}
.navbtn{background:var(--panel);border:1px solid var(--border);color:var(--text);width:42px;height:42px;border-radius:12px;font-size:20px;cursor:pointer;line-height:1;transition:.18s}
.navbtn:hover{border-color:transparent;background:var(--grad);box-shadow:0 6px 22px rgba(168,85,247,.4)}
.month{font-size:22px;font-weight:800;letter-spacing:-.4px;min-width:220px;text-align:center}
.today-btn{height:42px;padding:0 20px;border-radius:12px;border:0;font-size:14px;font-weight:800;cursor:pointer;color:#fff;background:var(--grad);box-shadow:0 6px 22px rgba(236,72,153,.35);transition:.18s}
.today-btn:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(236,72,153,.5)}
.calscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:16px}
.cal{min-width:820px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:center;padding:6px 0 10px}
.cell{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));border:1px solid var(--border);border-radius:14px;min-height:132px;padding:9px;display:flex;flex-direction:column;gap:7px;transition:.18s}
.cell:hover{border-color:var(--border2)}
.cell.blank{background:transparent;border:0}
.cell.past{opacity:.38}
.cell.today{border:1px solid transparent;background:linear-gradient(var(--bg2),var(--bg2)) padding-box,var(--grad) border-box;box-shadow:0 0 0 1px rgba(168,85,247,.25),0 14px 40px -10px rgba(168,85,247,.5)}
.cell-top{display:flex;align-items:center;justify-content:space-between}
.cell-date{font-size:12px;color:var(--dim);font-weight:800}
.cell.today .cell-date{color:#fff}
.today-pill{font-size:9px;font-weight:900;letter-spacing:.08em;padding:2px 7px;border-radius:20px;color:#fff;background:var(--grad);box-shadow:0 0 14px rgba(236,72,153,.6)}
.ev{display:block;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:7px 9px;transition:.16s;position:relative;overflow:hidden}
.ev::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad);opacity:.85}
.ev:hover{border-color:transparent;background:rgba(168,85,247,.12);box-shadow:0 6px 20px -6px rgba(168,85,247,.6);transform:translateY(-1px)}
.ev-time{font-size:11px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.02em}
.ev-name{font-size:12.5px;font-weight:700;color:#f1f1f6;line-height:1.25;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev-venue{font-size:10px;color:var(--muted);margin-top:2px}
.ev-lang{display:inline-block;font-size:8.5px;font-weight:800;padding:1px 6px;border-radius:6px;margin-top:4px;letter-spacing:.04em}
.ev-lang.en{background:rgba(34,211,238,.16);color:#67e8f9}
.ev-lang.fr{background:rgba(236,72,153,.16);color:#f9a8d4}
.cell-empty{font-size:10px;color:var(--dim);margin-top:auto;font-style:italic}
@media(max-width:640px){.hero{padding:38px 16px 4px}.month{min-width:150px;font-size:18px}}
footer{border-top:1px solid var(--border);padding:36px 24px;text-align:center;color:var(--muted);font-size:13px}
footer a{color:var(--muted)}footer a:hover{color:var(--text)}
.footer-links{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">Paris<span>Comedy</span></a>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/shows.html" class="nav-active">Shows</a>
    <a href="/hiring.html">Stage Time</a>
    <a href="/venues.html">Venues</a>
    <a href="/comedians.html">Comedians</a>
    <a href="/bookers.html">Bookers</a>
    <a href="/pricing.html">Pricing</a>
    <a href="/login.html">Sign In</a>
    <a href="/connect.html">Book / Connect</a>
    <a href="/about.html">About</a>
    <a href="/feedback.html">Feedback</a>
  </div>
</nav>

<div class="hero">
  <h1>Comedy <span class="g">Calendar</span></h1>
  <p>Every stand-up show in Paris, by night. Tap any show for details and tickets.</p>
</div>

<div class="calwrap">
  <div class="calbar">
    <button class="navbtn" id="prev" aria-label="Previous month">&#8249;</button>
    <div class="month" id="monthLabel">—</div>
    <button class="navbtn" id="next" aria-label="Next month">&#8250;</button>
    <button class="today-btn" id="todayBtn">Today</button>
  </div>
  <div class="calscroll">
    <div class="cal" id="cal"></div>
  </div>
</div>

<footer>
  <div class="footer-links">
    <a href="/">Home</a>
    <a href="/shows.html">Shows</a>
    <a href="/venues.html">Venues</a>
    <a href="/comedians.html">Comedians</a>
    <a href="/connect.html">Book / Connect</a>
    <a href="/about.html">About</a>
  </div>
  <div>payments@pariscomedy.com</div>
</footer>

<script>
const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
let SHOWS = [];
let view = new Date(); view.setDate(1);

function parisTodayStr(){ return new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Paris'}); }
const TODAY = parisTodayStr();

async function loadShows(){
  let api = 'https://api.pariscomedy.com';
  try { const c = await fetch('/api-config.json',{cache:'no-store'}).then(r=>r.json()); if(c&&c.api) api=c.api; } catch(e){}
  try {
    const rows = await fetch(api+'/api/listings',{cache:'no-store'}).then(r=>r.json());
    SHOWS = (Array.isArray(rows)?rows:[]).filter(s=>s.booking_url||s.show_url).map(s=>({
      slug: s.slug||'',
      name: s.name||'',
      venue: s.venue_name || (s.venue && s.venue.name) || s.venue_name_raw || '',
      days: Array.isArray(s.days)?s.days:[],
      time: s.start_time||'',
      language: (s.language||'en')
    }));
  } catch(e){ console.warn('[pc] /api/listings failed', e); SHOWS=[]; }
  render(); scrollToToday();
}

function isSeasonallyVisible(name, dateStr){
  const n=(name||'').toLowerCase();
  if(n.includes('velvet bar comedy')){ if(dateStr>='2026-07-09'&&dateStr<'2026-09-09') return false; if(dateStr>'2026-12-24') return false; }
  return true;
}
function showsOn(date){
  const wd = DOW[date.getDay()];
  const ds = date.toLocaleDateString('sv-SE');
  return SHOWS.filter(s=>s.days.includes(wd) && isSeasonallyVisible(s.name, ds))
             .sort((a,b)=>(a.time||'').localeCompare(b.time||''));
}

function render(){
  const y=view.getFullYear(), m=view.getMonth();
  document.getElementById('monthLabel').textContent = MONTHS[m]+' '+y;
  const cal=document.getElementById('cal'); cal.innerHTML='';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>{
    const h=document.createElement('div'); h.className='dow'; h.textContent=d; cal.appendChild(h);
  });
  const first=new Date(y,m,1); const pad=first.getDay(); const dim=new Date(y,m+1,0).getDate();
  for(let i=0;i<pad;i++){ const b=document.createElement('div'); b.className='cell blank'; cal.appendChild(b); }
  for(let d=1; d<=dim; d++){
    const date=new Date(y,m,d); const ds=date.toLocaleDateString('sv-SE');
    const cell=document.createElement('div'); cell.className='cell';
    if(ds<TODAY) cell.className+=' past';
    if(ds===TODAY){ cell.className+=' today'; cell.id='todayCell'; }
    const top=document.createElement('div'); top.className='cell-top';
    top.innerHTML = `<span class="cell-date">${d}</span>` + (ds===TODAY?'<span class="today-pill">TONIGHT</span>':'');
    cell.appendChild(top);
    const evs = showsOn(date);
    evs.forEach(s=>{
      const a=document.createElement('a'); a.className='ev';
      a.href = s.slug ? ('/show.html?slug='+encodeURIComponent(s.slug)) : '#';
      a.innerHTML = `<div class="ev-time">${s.time||''}</div>`
        + `<div class="ev-name">${s.name}</div>`
        + (s.venue?`<div class="ev-venue">${s.venue}</div>`:'')
        + `<span class="ev-lang ${s.language==='fr'?'fr':'en'}">${(s.language||'en').toUpperCase()}</span>`;
      cell.appendChild(a);
    });
    if(ds===TODAY && !evs.length){ const e=document.createElement('div'); e.className='cell-empty'; e.textContent='No show tonight'; cell.appendChild(e); }
    cal.appendChild(cell);
  }
}
function scrollToToday(){
  // Land on TODAY when the page opens (Robert 2026-06-29): bring today's row near
  // the top of the viewport. Double-rAF so layout is settled before measuring.
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const t=document.getElementById('todayCell'); if(!t) return;
    const y=t.getBoundingClientRect().top + window.pageYOffset - 96;
    if(y>40) window.scrollTo({top:y,behavior:'smooth'});
  }));
}
document.getElementById('prev').onclick=()=>{ view.setMonth(view.getMonth()-1); render(); };
document.getElementById('next').onclick=()=>{ view.setMonth(view.getMonth()+1); render(); };
document.getElementById('todayBtn').onclick=()=>{ view=new Date(); view.setDate(1); render(); scrollToToday(); };
loadShows();
</script>
</body>
</html>
