// ── HELPERS ────────────────────────────────────────────────────────────────
const todayParis = () => new Date().toLocaleDateString('sv-SE', {timeZone: 'Europe/Paris'});

function weekEnd() {
  const d = new Date(new Date().toLocaleDateString('sv-SE', {timeZone:'Europe/Paris'}));
  d.setDate(d.getDate() + 7);
  return d.toISOString().split('T')[0];
}

function fmtDateBadge(dateStr) {
  const [y,m,day] = dateStr.split('-').map(Number);
  const d = new Date(y,m-1,day);
  const days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  return `${days[d.getDay()]} &middot; ${months[m-1]} ${day}`;
}

function langBadges(langs) {
  const has = (l) => langs.includes(l);
  if (has('en') && has('fr')) return '<span class="badge-lang-bi">Bilingual</span>';
  if (has('fr')) return '<span class="badge-lang-fr">FR</span>';
  return '<span class="badge-lang-en">EN</span>';
}

function typeBadge(t) {
  const labels = {showcase:'Showcase',open_mic:'Open Mic',solo_show:'Solo Show'};
  return `<span class="badge-type">${labels[t]||t}</span>`;
}

function verifiedDate(d) {
  const [y,m,day] = d.split('-').map(Number);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${day} ${months[m-1]} ${y}`;
}

// ── STATE ──────────────────────────────────────────────────────────────────
let activeTab = 'tonight';
let activeDay = 'all';

// ── INIT TAB ───────────────────────────────────────────────────────────────
(function initTab() {
  const today = todayParis();
  const hasTonightShows = SHOWS_DATA.some(s => s.date === today);
  activeTab = hasTonightShows ? 'tonight' : 'week';
  document.getElementById('tab-' + activeTab).classList.add('active');
})();

// ── FILTER ────────────────────────────────────────────────────────────────
function getFiltered() {
  const today = todayParis();
  const week = weekEnd();
  const DAY_MAP = {Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday'};

  let shows = SHOWS_DATA.filter(s => s.date >= today); // always exclude past
  if (activeTab === 'tonight') shows = shows.filter(s => s.date === today);
  else if (activeTab === 'week') shows = shows.filter(s => s.date <= week);

  if (activeDay !== 'all') {
    const fullDay = DAY_MAP[activeDay];
    shows = shows.filter(s => s.day === fullDay);
  }

  shows.sort((a,b) => {
    if (a.date !== b.date) return a.date.localeCompare(b.date);
    return a.start_time.localeCompare(b.start_time);
  });
  return shows;
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render() {
  const grid = document.getElementById('shows-grid');
  const shows = getFiltered();

  if (shows.length === 0) {
    const isTonight = activeTab === 'tonight';
    grid.innerHTML = `<div class="empty-state">
      <strong>${isTonight ? 'No verified shows tonight yet' : 'No shows found'}</strong>
      ${isTonight ? 'Check back later, or browse this week\'s listings.' : 'Try a different filter.'}
      ${isTonight ? `<br><button class="empty-btn" onclick="setTab('week')">See This Week →</button>` : ''}
    </div>`;
    return;
  }

  grid.innerHTML = shows.map(s => {
    const langs = s.language || ['en'];
    const isBi = langs.includes('en') && langs.includes('fr');
    return `<div class="show-card">
      <div class="card-top">
        <div class="card-name-row">
          <span class="card-emoji">${s.emoji}</span>
          <span class="card-name">${s.show_name}</span>
        </div>
        <span class="card-date-badge">${fmtDateBadge(s.date)}</span>
      </div>
      <div class="badge-row">
        ${langBadges(langs)}
        ${typeBadge(s.show_type)}
      </div>
      <div class="card-meta">${s.start_time} &middot; ${s.venue} &middot; ${s.neighborhood}</div>
      <div class="card-desc">&ldquo;${s.description}&rdquo;</div>
      <div class="card-proof">
        📋 Curated from public listings &middot; Last checked ${verifiedDate(s.last_verified_at)}
        &nbsp;&nbsp;<a href="${s.source_url}" target="_blank" rel="noopener">Source &#8599;</a>
      </div>
      <div class="card-actions">
        <a href="${s.ticket_url}" target="_blank" rel="noopener" class="btn-tickets">Get Tickets &rarr;</a>
        <div class="card-links">
          <a href="/book.html">Claim This Show</a>
          <a href="/book.html">Something wrong?</a>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── CONTROLS ──────────────────────────────────────────────────────────────
function setTab(t) {
  activeTab = t;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + t).classList.add('active');
  render();
}

function setDay(d) {
  activeDay = d;
  document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('day-' + d).classList.add('active');
  render();
}

render();
</script>
