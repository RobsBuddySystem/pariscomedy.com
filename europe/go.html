<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Redirecting to tickets… — Paris Comedy</title>
<link rel="canonical" href="https://pariscomedy.com/europe/go.html">
<style>
:root{--navy:#0a0e1a;--gold:#c9a84c;--muted:#8899aa}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--navy);color:#f0f0f0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.msg{max-width:420px}
.msg h1{font-size:22px;font-weight:700;margin-bottom:12px}
.msg p{font-size:15px;color:var(--muted);margin-bottom:24px;line-height:1.6}
.spinner{width:32px;height:32px;border:3px solid #1e2a3a;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
.fallback{font-size:13px;color:#556;margin-top:16px}
.fallback a{color:var(--gold)}
</style>
</head>
<body>
<div class="msg">
  <div class="spinner"></div>
  <h1>Taking you to the box office…</h1>
  <p id="show-name">Loading ticket link…</p>
  <div class="fallback">If nothing happens, <a id="manual-link" href="/europe.html">go back to Europe shows</a>.</div>
</div>
<script>
// PARTNERSHIP FUTURE-PROOFING: this page is the single choke point every
// ticket link on the site passes through. It never links out raw. It:
//   1) resolves the outbound URL from /data/ticket_links.json (built by
//      scripts/build_europe_pages.py from data/upcoming_events.json),
//   2) appends any partner/affiliate params from that same file's
//      PARTNER_PARAMS map (empty today — one regenerate adds codes
//      everywhere once a partnership lands),
//   3) redirects.
// Its own page load (europe/go.html?e=<slug>) is tracked as a pageview
// by /assets/track.js, which is the click-count evidence for partnership
// negotiations — no new backend needed for that part.
(async function() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('e') || '';

  if (!slug) {
    document.getElementById('show-name').textContent = 'No show specified.';
    return;
  }

  function safeHttpUrl(rawUrl) {
    try {
      const u = new URL(rawUrl);
      return /^https?:$/.test(u.protocol) ? u : null;
    } catch (_) { return null; }
  }

  let entry = null;
  let partnerParams = {};
  try {
    const map = await fetch('/data/ticket_links.json', {cache: 'no-store'}).then(r => r.json());
    entry = (map.links || map)[slug] || null;
    partnerParams = map.PARTNER_PARAMS || {};
  } catch (e) {
    // ticket_links.json unreachable
  }

  if (!entry || !entry.url) {
    document.getElementById('show-name').textContent = 'Ticket link not found for this show.';
    document.getElementById('manual-link').textContent = 'go back to Europe shows';
    return;
  }

  const u = safeHttpUrl(entry.url);
  if (!u) {
    document.getElementById('show-name').textContent = 'Invalid ticket URL.';
    return;
  }

  // Global partner params (empty until a partnership lands), plus any
  // event/host-specific override under partnerParams[hostname].
  const host = u.hostname.replace(/^www\./, '');
  const globalParams = partnerParams['*'] || {};
  const hostParams = partnerParams[host] || {};
  Object.entries({...globalParams, ...hostParams}).forEach(([k, v]) => {
    if (!u.searchParams.has(k)) u.searchParams.set(k, v);
  });

  const finalUrl = u.toString();

  // Best-effort local click log, mirrors r.html's fallback pattern.
  try {
    const clicks = JSON.parse(localStorage.getItem('ticket_clicks') || '[]');
    clicks.push({slug, url: finalUrl, timestamp: new Date().toISOString()});
    if (clicks.length > 200) clicks.splice(0, clicks.length - 200);
    localStorage.setItem('ticket_clicks', JSON.stringify(clicks));
  } catch (_) {}

  document.getElementById('show-name').textContent = 'Taking you to: ' + (entry.title || slug.replace(/-/g, ' '));
  document.getElementById('manual-link').href = finalUrl;
  document.getElementById('manual-link').textContent = 'click here to go directly';

  setTimeout(function() {
    window.location.href = finalUrl;
  }, 300);
})();
</script>
<script src="/assets/track.js?v=20260801" defer></script>
</body>
</html>
