<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Non-Eventbrite Shows — Test Page</title>
<style>
  body{background:#0a0a0a;color:#f0f0f0;font:14px system-ui,-apple-system,sans-serif;margin:0;padding:24px}
  h1{font-size:24px;margin:0 0 8px}
  .sub{color:#888;margin-bottom:20px;font-size:13px}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  button{background:#7c3aed;color:#fff;border:0;padding:10px 16px;border-radius:6px;font-weight:600;cursor:pointer;font-size:13px}
  button.alt{background:#1a1a1a;border:1px solid #444}
  button.active{background:#059669}
  .meta{color:#888;font-size:12px;margin:8px 0 16px}
  table{border-collapse:collapse;width:100%;background:#111}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #222;vertical-align:top}
  th{background:#1a1a1a;font-size:12px;text-transform:uppercase;color:#bdbdbd;letter-spacing:0.5px}
  tr:hover{background:#161616}
  a{color:#f0c674;text-decoration:none}
  a:hover{text-decoration:underline}
  .badge{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600;text-transform:uppercase}
  .bil{background:#e11d48;color:#fff}
  .fev{background:#7c3aed;color:#fff}
  .sho{background:#059669;color:#fff}
  .fna{background:#f59e0b;color:#000}
  .empty{color:#666;font-style:italic;padding:40px;text-align:center;background:#111;border-radius:6px}
  .stale{color:#dc2626;font-size:11px}
</style>
</head>
<body>
<h1>Non-Eventbrite Shows — Test Page</h1>
<div class="sub">Local test page · NOT published · Shows sourced from BilletRéduc, Fever, Shotgun, FnacSpectacles only · No Eventbrite</div>

<div class="controls">
  <button id="btn-all" class="active" onclick="showAll()">Show all non-Eventbrite</button>
  <button class="alt" onclick="filter('billetreduc')">BilletRéduc only</button>
  <button class="alt" onclick="filter('feverup')">Fever only</button>
  <button class="alt" onclick="filter('shotgun')">Shotgun only</button>
  <button class="alt" onclick="filter('fnacspectacles')">FnacSpectacles only</button>
</div>

<div class="meta" id="meta">Click a button to load shows.</div>

<div id="results"></div>

<script>
// Data hand-curated from data/content-source-coverage-2b-candidates.json + data/manual-review-show-candidates.json
// All entries are FROM the 4 non-Eventbrite ticket platforms only.
const SHOWS = [
  {name:"Paname Comedy Club", venue:"Paname Art Cafe", lang:"fr", day:"recurring", time:"varies", url:"https://www.fnacspectacles.com/artist/paname-comedy-club/paname-comedy-club-paris-3410304/", platform:"fnacspectacles", platformLabel:"FnacSpectacles", confidence:88, status:"candidate (awaiting Robert)"},
  {name:"Golden Comedy Club", venue:"Golden Comedy Spot, 75002", lang:"fr", day:"daily", time:"varies", url:"https://feverup.com/m/111045/en", platform:"feverup", platformLabel:"Fever", confidence:92, status:"candidate (awaiting Robert)"},
  {name:"The Joke Comedy Club", venue:"The Joke, 75004", lang:"fr", day:"recurring", time:"varies", url:"https://feverup.com/en/paris/venue/the-joke", platform:"feverup", platformLabel:"Fever", confidence:82, status:"candidate (awaiting Robert)"},
  {name:"Le Plateau Comedy Club", venue:"Monsieur le Zinc, 75010", lang:"fr", day:"recurring", time:"varies", url:"https://feverup.com/m/474472/en", platform:"feverup", platformLabel:"Fever", confidence:78, status:"candidate (awaiting Robert)"},
  {name:"Marco Polo Comedy Club", venue:"33 Rue Berger, 75001", lang:"fr", day:"recurring", time:"varies", url:"https://feverup.com/m/124093/en", platform:"feverup", platformLabel:"Fever", confidence:65, status:"future_watch"},
  {name:"Le Fridge Comedy Night", venue:"Le Fridge Comedy, 75002", lang:"fr", day:"recurring", time:"varies", url:"https://www.billetreduc.com/263384/evt.htm", platform:"billetreduc", platformLabel:"BilletRéduc", confidence:75, status:"candidate (awaiting Robert)"},
  {name:"Fridge Open Mic", venue:"Le Fridge Comedy, 75002", lang:"fr", day:"recurring", time:"varies", url:"https://www.billetreduc.com/263450/evt.htm", platform:"billetreduc", platformLabel:"BilletRéduc", confidence:72, status:"excluded (open mic)"},
  {name:"No Name Comedy Club", venue:"Paris", lang:"fr", day:"recurring", time:"varies", url:"https://www.billetreduc.com/263800/evt.htm", platform:"billetreduc", platformLabel:"BilletRéduc", confidence:65, status:"future_watch"}
];

function badgeClass(p){
  return {billetreduc:'bil', feverup:'fev', shotgun:'sho', fnacspectacles:'fna'}[p] || '';
}

function render(rows){
  const meta = document.getElementById('meta');
  const out = document.getElementById('results');
  if(!rows.length){
    out.innerHTML = '<div class="empty">No shows found for this platform.</div>';
    meta.textContent = '0 shows.';
    return;
  }
  const byPlatform = {};
  rows.forEach(r => byPlatform[r.platform] = (byPlatform[r.platform]||0)+1);
  meta.innerHTML = rows.length + ' shows · ' + Object.entries(byPlatform).map(([p,n]) => `<span class="badge ${badgeClass(p)}">${n}× ${rows.find(r=>r.platform===p).platformLabel}</span>`).join(' ');
  out.innerHTML = `<table>
    <thead><tr><th>Show</th><th>Venue</th><th>Lang</th><th>Platform</th><th>Conf</th><th>Status</th><th>Source link</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td><strong>${r.name}</strong></td>
      <td>${r.venue||'—'}</td>
      <td>${r.lang}</td>
      <td><span class="badge ${badgeClass(r.platform)}">${r.platformLabel}</span></td>
      <td>${r.confidence}</td>
      <td>${r.status}</td>
      <td><a href="${r.url}" target="_blank" rel="noopener">open →</a></td>
    </tr>`).join('')}</tbody>
  </table>`;
}

function showAll(){
  document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-all').classList.add('active');
  render(SHOWS);
}
function filter(p){
  document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  render(SHOWS.filter(s=>s.platform===p));
}
showAll();
</script>
</body>
</html>
