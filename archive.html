<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paris Comedy — Archive</title>
<meta name="description" content="Archive of past comedians, shows and venues from the Paris stand-up scene. Anything inactive for 6+ months.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#f0f0f0;min-height:100vh}
a{color:inherit;text-decoration:none}
nav{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid #222;position:sticky;top:0;background:#0a0a0a;z-index:100}
.nav-logo{font-size:18px;font-weight:700;letter-spacing:-0.5px}
.nav-logo span{color:#f5c518}
.nav-links{display:flex;gap:20px;font-size:14px;color:#888}
.nav-links a:hover{color:#f0f0f0}
.hero{text-align:center;padding:60px 24px 30px}
.hero h1{font-size:clamp(28px,5vw,52px);font-weight:800;letter-spacing:-1px;line-height:1.1;margin-bottom:12px}
.hero h1 span{color:#888}
.hero p{color:#888;font-size:15px;max-width:560px;margin:0 auto}
.section{max-width:1100px;margin:40px auto;padding:0 24px}
.section h2{font-size:22px;margin-bottom:16px;color:#f5c518;border-bottom:1px solid #222;padding-bottom:8px}
.section h2 small{color:#666;font-weight:400;font-size:14px;margin-left:8px}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.item{background:#111;border:1px solid #1e1e1e;border-radius:8px;padding:10px 12px;font-size:13px}
.item .nm{font-weight:600;color:#ddd}
.item .meta{color:#666;font-size:11px;margin-top:2px}
footer{text-align:center;padding:40px 24px;color:#555;font-size:12px;border-top:1px solid #1a1a1a;margin-top:60px}
</style>
</head>
<body>
<nav>
  <div class="nav-logo">Paris<span>Comedy</span></div>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/shows.html">Shows</a>
    <a href="/comedians.html">Comedians</a>
    <a href="/venues.html">Venues</a>
    <a href="/archive.html" style="color:#f0f0f0">Archive</a>
  </div>
</nav>
<div class="hero">
  <h1>The <span>Archive</span></h1>
  <p>Comedians, shows and venues that haven't been seen on a Paris stage in 6+ months. Kept for the historical record.</p>
</div>

<div class="section">
  <h2>Archived Comedians <small id="count-comics"></small></h2>
  <div class="row" id="comics"></div>
</div>

<div class="section">
  <h2>Archived Shows <small id="count-shows"></small></h2>
  <div class="row" id="shows"></div>
</div>

<div class="section">
  <h2>Archived Venues <small id="count-venues"></small></h2>
  <div class="row" id="venues"></div>
</div>

<footer>Records since 2026 — pariscomedy.com archive.</footer>

<script>
const ARCH_COMICS = [];
const ARCH_SHOWS = [];
const ARCH_VENUES = [];

function render(arrId, items, fmt){
  const el = document.getElementById(arrId);
  el.innerHTML = items.map(fmt).join('') || '<div style="color:#555;padding:8px">— none yet —</div>';
  document.getElementById('count-' + arrId).textContent = items.length ? `(${items.length})` : '';
}

render('comics', ARCH_COMICS, c => `<div class="item"><div class="nm">${c.name}</div><div class="meta">last seen ${c.last_seen||'—'}</div></div>`);
render('shows',  ARCH_SHOWS,  s => `<div class="item"><div class="nm">${s.name}</div><div class="meta">${s.venue||''} · ended ${s.end_date||'—'}</div></div>`);
render('venues', ARCH_VENUES, v => `<div class="item"><div class="nm">${v.name}</div><div class="meta">${v.address||''}</div></div>`);
</script>
</body>
</html>
