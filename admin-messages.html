<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Message & Booking Queue</title>
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--card:#111;--border:#1e1e1e;--text:#f0f0f0;--muted:#888;--purple:#7c3aed;--green:#10b981;--red:#ef4444;--yellow:#f5c518}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;padding:20px;max-width:1100px;margin:0 auto}
h1{font-size:22px;font-weight:800;margin-bottom:14px}
.gate{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:20px}
input,select{padding:9px 12px;background:#0f0f0f;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:inherit}
button{padding:8px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:13px;background:var(--purple);color:#fff}
button:hover{opacity:.9}
button.danger{background:var(--red)}
button.success{background:var(--green)}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
th,td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{background:#0f0f0f;font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase}
.tag-pending{background:#2a2a1a;color:var(--yellow)}
.tag-approved{background:#14532d;color:#4ade80}
.tag-rejected{background:#3a1a1a;color:#e07a7a}
.tag-booker_invite{background:#2a1a5a;color:#a07ae0}
.muted{color:var(--muted);font-size:12px}
.msg-body{max-width:380px;white-space:pre-wrap;line-height:1.4}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.filter-bar{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<nav class="nav-shell nav-shell-admin">
  <a href="/" class="nav-logo">Paris<span>Comedy</span> Admin</a>
  <div class="nav-links">
    <a href="/admin-events.html">Events</a>
    <a href="/admin-crm.html">CRM</a>
    <a href="/admin-messages.html" class="nav-active">Messages</a>
    <a href="/admin-payments.html">Payments</a>
    <a href="/admin-submit.html">Submit</a>
    <a href="/api/review-queue.html">Review Queue</a>
    <a href="/login.html">Sign Out</a>
  </div>
</nav>

<h1>Admin · Message & Booking Queue</h1>

<div class="gate" id="gate">
  <p class="muted" style="margin-bottom:10px">Enter your admin token to load the review queue.</p>
  <div style="display:flex;gap:8px">
    <input id="token" type="password" placeholder="ADMIN_TOKEN" style="flex:1">
    <button onclick="loadQueue()">Load queue</button>
  </div>
  <div class="muted" id="status" style="margin-top:10px"></div>
</div>

<div class="filter-bar" id="filters" style="display:none">
  <span class="muted">Status:</span>
  <select id="status-filter" onchange="loadQueue()">
    <option value="pending_review">Pending review</option>
    <option value="booker_invite_pending">Booker invites</option>
    <option value="approved">Approved</option>
    <option value="rejected">Rejected</option>
    <option value="delivered">Delivered</option>
  </select>
  <button class="ghost" onclick="loadQueue()">↻ Refresh</button>
  <span class="muted" id="count"></span>
</div>

<table id="queue-table" style="display:none">
  <thead>
    <tr>
      <th>ID</th><th>From</th><th>→</th><th>To</th><th>Subject / Message</th><th>Status</th><th></th>
    </tr>
  </thead>
  <tbody id="queue-body"></tbody>
</table>

<script>
const API_BASE_PROMISE = fetch('/api-config.json').then(r => r.json()).then(c => c.api);

function esc(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function loadQueue() {
  const token = document.getElementById('token').value.trim();
  if (!token) return;
  localStorage.setItem('admin_token', token);
  const status = document.getElementById('status-filter')?.value || 'pending_review';
  const base = await API_BASE_PROMISE;
  try {
    const r = await fetch(`${base}/api/admin/messages?token=${encodeURIComponent(token)}&status=${status}`);
    if (!r.ok) { document.getElementById('status').textContent = 'Auth failed (' + r.status + ')'; return; }
    const data = await r.json();
    document.getElementById('status').textContent = '';
    document.getElementById('filters').style.display = 'flex';
    document.getElementById('queue-table').style.display = 'table';
    document.getElementById('count').textContent = `${data.count} item(s)`;
    render(data.queue, token);
  } catch (e) { document.getElementById('status').textContent = e.message; }
}

function render(queue, token) {
  const body = document.getElementById('queue-body');
  if (!queue.length) { body.innerHTML = '<tr><td colspan="7" class="muted" style="text-align:center;padding:30px">Queue is empty.</td></tr>'; return; }
  body.innerHTML = queue.map(m => `
    <tr>
      <td>#${m.id}<br><span class="muted">${m.created_at}</span></td>
      <td><strong>${esc(m.sender_name)}</strong><br><span class="muted">${esc(m.sender_email)}<br>${esc(m.sender_type)}</span></td>
      <td>→</td>
      <td><strong>${esc(m.recipient_type)}</strong><br><span class="muted">${esc(m.recipient_id||'(general)')}</span></td>
      <td><div><strong>${esc(m.subject||'(no subject)')}</strong></div><div class="msg-body muted">${esc(m.message)}</div></td>
      <td><span class="tag tag-${m.status.startsWith('booker_invite')?'booker_invite':m.status.includes('pending')?'pending':m.status}">${esc(m.status)}</span></td>
      <td>
        <div class="row-actions">
          <button class="success" onclick="setStatus(${m.id},'approved','${token}')">Approve</button>
          <button class="danger" onclick="setStatus(${m.id},'rejected','${token}')">Reject</button>
          <button class="ghost" onclick="setStatus(${m.id},'delivered','${token}')">Mark delivered</button>
        </div>
      </td>
    </tr>`).join('');
}

async function setStatus(id, status, token) {
  const base = await API_BASE_PROMISE;
  const r = await fetch(`${base}/api/admin/messages/${id}/status`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({token, status})
  });
  if (r.ok) loadQueue();
  else alert('Failed: ' + r.status);
}

// Auto-fill saved token
const saved = localStorage.getItem('admin_token');
if (saved) { document.getElementById('token').value = saved; loadQueue(); }
</script>

  <div class="footer-admin-inner">
    <span class="footer-admin-brand">Paris Comedy Admin</span>
    <span class="footer-admin-sep">·</span>
    <span class="footer-admin-env">Production</span>
    <span class="footer-admin-sep">·</span>
    <a href="/terms.html">Terms</a>
    <span class="footer-admin-sep">·</span>
    <a href="/privacy.html">Privacy</a>
  </div>
</footer>

  .footer-admin { padding: 10px 16px; text-align: left; color: #6b7280; font-size: 0.75rem; border-top: 1px solid rgba(255,255,255,0.06); margin-top: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace, monospace; letter-spacing: 0.02em; }
  .footer-admin a { color: inherit; text-decoration: none; }
  .footer-admin a:hover { color: #a78bfa; }
  .footer-admin-sep { margin: 0 8px; opacity: 0.4; }
  .footer-admin-brand { font-weight: 600; opacity: 0.85; }
  .footer-admin-env { opacity: 0.7; }
</style>
</body>
</html>
