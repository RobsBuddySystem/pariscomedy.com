pipeline:
  version: "1.0"
  timezone: "Europe/Paris"
  lookback_days: 7
  lookahead_days: 60

sources:
  eventbrite_paris:
    url: "https://www.eventbrite.com/d/france--paris/comedy/"
    enabled: true
  eventbrite_english:
    url: "https://www.eventbrite.com/d/france--paris/english-comedy/"
    enabled: true
  eventbrite_standupcomedy:
    url: "https://www.eventbrite.com/d/france--paris/stand-up-comedy/"
    enabled: true

llm:
  provider: "ollama"
  # Primary model: qwen2.5:32b on PC-LAPTOP (Tailscale)
  model: "qwen2.5:32b"
  # Fallback models in order
  fallback_model: "mistral:7b"
  # Ollama endpoint fall-through (mirrors brain-daemon-local-llm.py)
  endpoints:
    - "http://localhost:11434"                          # Mac Ollama (if installed)
    - "http://100.75.13.73:11434"                       # PC-LAPTOP via Tailscale (live)
    - "http://openclawpc.tail6669ff.ts.net:11434"       # 3090 box (if running ollama serve)
  timeout_seconds: 30

confidence:
  auto_publish_threshold: 0.80   # >= 0.80 → exported to shows_generated.json
  review_threshold: 0.50          # 0.50–0.79 → review_queue.json
  reject_threshold: 0.50          # < 0.50 → discarded (logged)

comedy_signals:
  include:
    - comedy
    - stand-up
    - standup
    - open mic
    - improv
    - comedian
    - humour
    - humor
    - rire
    - comedy club
    - showcase
    - comédie
    - comique
  exclude:
    - yoga
    - boxing
    - fashion
    - "dance class"
    - wellness
    - "business networking"
    - conference
    - workshop
    - market
    - "gala dinner"
    - "art exhibition"

sync:
  macstudio_host: "macstudio.local"
  macstudio_user: "chuck"
  macstudio_repo_path: "/Users/chuck/Documents/Claude/Projects/pariscomedy.com/_repo"
  rsync_flags: "-avz --checksum"

paths:
  output_dir: "./pipeline/output"
  log_dir: "./pipeline/logs"
  review_queue: "./pipeline/output/review_queue.json"
  shows_generated: "./data/shows_generated.json"
  shows: "./data/shows.json"
  data_drift: "./data/data_drift.json"
  source_check_failures: "./data/source_check_failures.json"
