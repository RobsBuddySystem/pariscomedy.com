<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redirecting... — Paris Comedy</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#f0f0f0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;}
.msg{max-width:400px;padding:24px;}
a{color:#f5c518;}
</style>
</head>
<body>
<div class="msg">
  <p>Taking you to the booking page&hellip;</p>
  <p style="font-size:13px;color:#888;margin-top:12px;">If you are not redirected, <a id="fallback" href="/">click here</a>.</p>
</div>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var dest = params.get('url');
  if (!dest) { window.location.href = '/'; return; }
  // Safety: only allow http/https
  try {
    var u = new URL(dest);
    if (u.protocol !== 'https:' && u.protocol !== 'http:') { window.location.href = '/'; return; }
  } catch(e) { window.location.href = '/'; return; }
  document.getElementById('fallback').href = dest;
  // Log click (fire-and-forget)
  try { fetch('/api/click', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ url: dest, ref: document.referrer, ts: Date.now() }) }); } catch(e){}
  window.location.href = dest;
})();
</script>
</body>
</html>
